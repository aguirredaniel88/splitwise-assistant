services:
  - type: web
    name: splitwise-assistant
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: ..
    plan: free
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SPLITWISE_OAUTH_ACCESS_TOKEN
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_NUMBER
        value: "whatsapp:+14155238886"
      - key: SPLITWISE_MCP_PATH
        value: /app/splitwise-mcp/app.py
      - key: PORT
        value: "8000"
