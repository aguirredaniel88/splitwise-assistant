[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "splitwise-assistant"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "anthropic>=0.40.0",
    "fastmcp>=3.0.0",
    "twilio>=9.0.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/splitwise_assistant"]

[project.scripts]
splitwise-assistant = "splitwise_assistant.main:main"
